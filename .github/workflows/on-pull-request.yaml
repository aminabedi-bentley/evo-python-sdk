name: Tests and Linting

permissions:
  contents: read

on:
  pull_request:

jobs:
  run-pre-commit:
    name: Run pre commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.1

  run-linting:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/linting

  check-stubs:
    name: Check generated stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-uv
      # Offline and deterministic: re-renders evo-compute's stub from the committed
      # catalogue snapshot and fails if it differs from the one checked in.
      - name: Check evo-compute stubs are up to date
        shell: bash
        run: make check-stubs-compute

  run-tests:
    uses: ./.github/workflows/run-all-tests.yaml
